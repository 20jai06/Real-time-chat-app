services:
  - type: web
    name: chat-backend
    env: docker
    plan: free
    rootDir: backend
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: chat-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: chat-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: chat-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: chat-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: chat-db
          property: password

  - type: web
    name: chat-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://chat-backend-2qot.onrender.com

databases:
  - name: chat-db
    plan: free
    databaseName: chatdb
    user: chatuser
